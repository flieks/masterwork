name: Feature request
description: Suggest something Masterwork should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
      description: The situation that prompted this, not the solution you have in mind.
    validations: { required: true }

  - type: textarea
    id: idea
    attributes:
      label: What you'd like it to do
    validations: { required: true }

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browsing / editing assets
        - Simulations and scoring
        - Chat and proposals
        - Projects
        - A new agent provider (Codex, Cursor, Gemini CLI, …)
        - Something else
    validations: { required: true }

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend lint + types
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  backend-tests:
    # Both dialects: SQLite is what a fresh install gets, Postgres is what the
    # author runs. A change that works on one and breaks the other must fail here.
    name: backend tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: sqlite
            database_url: sqlite+aiosqlite:///./ci.db
          - dialect: postgres
            database_url: postgresql+asyncpg://postgres:postgres@localhost:5432/masterwork
    env:
      DATABASE_URL: ${{ matrix.database_url }}
      # conftest shells out to createdb/dropdb for the Postgres leg.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        if: matrix.dialect == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres \
            postgres:16
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for i in $(seq 30); do pg_isready -h localhost -U postgres && break; sleep 2; done
          createdb masterwork

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    name: frontend typecheck + build + component tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ct

  contract:
    # The generated client is committed, so it can silently drift from the API.
    # Same check the pre-commit hook runs, so a green hook means a green job.
    name: openapi contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci
        working-directory: frontend
      - run: uv sync --frozen
        working-directory: backend

      # No server and no database: the schema comes off the FastAPI app object.
      # STRICT turns a missing JDK or node_modules into a failure rather than a
      # skipped client check, so a setup regression here can't pass silently.
      - name: Compare the committed spec and client against the app object
        run: scripts/regen-api.sh --check
        env:
          REGEN_API_STRICT: "1"

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # A runner has no ~/.claude, so the asset list would be empty and the specs
      # would fail on nothing-to-click. Point the providers at a seeded tree.
      - name: Seed an asset tree
        run: |
          mkdir -p /tmp/assets/skills/frontend-dev /tmp/assets/skills/backend-dev /tmp/assets/agents
          printf -- '---\nname: frontend-dev\ndescription: React frontend guidelines.\n---\n\n# Frontend\n' \
            > /tmp/assets/skills/frontend-dev/SKILL.md
          printf -- '---\nname: backend-dev\ndescription: Python FastAPI guidelines.\n---\n\n# Backend\n' \
            > /tmp/assets/skills/backend-dev/SKILL.md
          printf -- '---\nname: architect\ndescription: Plans features before building.\n---\n\n# Architect\n' \
            > /tmp/assets/agents/architect.md
          printf -- '# Global instructions\n\nBe concise.\n' > /tmp/assets/CLAUDE.md

      - name: Run the end-to-end specs against a real backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
          CLAUDE_SKILLS_ROOT: /tmp/assets/skills
          CLAUDE_AGENTS_ROOT: /tmp/assets/agents
          CLAUDE_PLUGINS_ROOT: /tmp/assets/plugins
          CLAUDE_INSTRUCTIONS_FILE: /tmp/assets/CLAUDE.md
        run: |
          set -euo pipefail
          cd backend
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8008 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 30); do
            curl -sf http://localhost:8008/api/v1/assets >/dev/null && break
            [ "$i" = 30 ] && { echo "backend did not come up"; exit 1; }
            sleep 2
          done
          curl -s http://localhost:8008/api/v1/assets | head -c 200; echo

          # BACKEND_URL un-skips the specs and starts Vite via Playwright's webServer.
          cd ../frontend
          BACKEND_URL=http://localhost:8008 npm run test:e2e
